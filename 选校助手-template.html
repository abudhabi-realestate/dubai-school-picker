        <div class="toolbar">
          <label style="margin:0" data-i18n="toolbar.sort">排序</label>

          <table>
            <thead>
              <tr>
                <th></th>
                <th data-i18n="table.school">学校</th>

                <th data-i18n="table.curriculum">课程体系</th>

      <div class="faq-header">
        <h2 data-i18n="faq.title">家长常见问题</h2>

          <span data-i18n="faq.sourcePrefix">来源：迪拜教育局（KHDA）</span>
          · <a id="faqSourceLink" href="#" target="_blank" rel="noopener" data-i18n="faq.sourceLink">官网原文</a>
          · <span data-i18n="faq.updatedPrefix">更新</span> <span id="faqUpdated"></span>
        </p>

        <input type="search" class="faq-search" id="faqSearch" placeholder="搜索：学费、转校、欺凌…" data-i18n-placeholder="faq.searchPlaceholder" />
        <button type="button" id="faqExpandAll" data-i18n="faq.expandAll">全部展开</button>
        <button type="button" id="faqCollapseAll" data-i18n="faq.collapseAll">全部收起</button>

  <script src="scripts/site-i18n-core.js"></script>
  <script src="scripts/i18n-page.js"></script>
  <script>
    const DATA = __SCHOOL_DATA__;
    const FAQ = __FAQ_DATA__;
    const FAQ_EN_BY_INDEX = window.PAGE_FAQ_EN_BY_INDEX || [];
    const { meta, filters, schools } = DATA;
    const t = (key, vars, fallback) => (window.SiteI18n ? window.SiteI18n.t(key, vars, fallback) : (fallback ?? key));
    const isEn = () => window.SiteI18n && window.SiteI18n.getLang() === 'en';

    const RATING_ORDER = {
      'Outstanding': 5,
      'Very good': 4,
      'Good': 3,
      'Acceptable': 2,
      'Weak': 1,
      'Very weak': 0,
    };

    const CURRICULUM_ZH = {
      'American': '美国课程',
      'American - International Baccalaureate': '美国课程 + 国际文凭（IB）',
      'Australian': '澳大利亚课程',
      'Chinese': '中国课程',
      'French': '法国课程',
      'German': '德国课程',
      'Indian': '印度课程',
      'Indian - UK': '印度课程 + 英国课程',
      'Indian/IB': '印度课程 + 国际文凭（IB）',
      'International Baccalaureate': '国际文凭（IB）',
      'International Baccalaureate (13Y)': '国际文凭（IB，13年制）',
      'IB (13 Y)': '国际文凭（IB，13年制）',
      'Iranian': '伊朗课程',
      'Iranian - International Baccalaureate': '伊朗课程 + 国际文凭（IB）',
      'Japanese': '日本课程',
      'Ministry of Education': '阿联酋教育部课程',
      'Ministry of Education - American': '阿联酋教育部 + 美国课程',
      'Ministry of Education/BTEC': '阿联酋教育部 + BTEC',
      'Ministry of Education / BTEC': '阿联酋教育部 + BTEC',
      'Pakistani': '巴基斯坦课程',
      'Philippine': '菲律宾课程',
      'Russian': '俄罗斯课程',
      'SABIS (UK/US)': 'SABIS 课程（英/美）',
      'UK': '英国课程',
      'UK*': '英国课程',
      'UK (12 Y - Grades)': '英国课程（12年制）',
      'UK (13 Y)': '英国课程（13年制）',
      'UK - International Baccalaureate': '英国课程 + 国际文凭（IB）',
      'UK - UK/IB': '英国课程 + 国际文凭（IB）',
      'UK/IB': '英国课程 + 国际文凭（IB）',
      'UK/IB (12 Y)': '英国课程 + 国际文凭（IB，12年制）',
      'UK/IB (13 Y)': '英国课程 + 国际文凭（IB，13年制）',
      'UK/BTEC': '英国课程 + BTEC',
      'US/IB': '美国课程 + 国际文凭（IB）',
      'Other': '其他',
    };

    const UK_IB_CURRICULA = [
      'UK - International Baccalaureate',
      'UK - UK/IB',
      'UK/IB',
      'UK/IB (12 Y)',
      'UK/IB (13 Y)',
    ];
    const UK_IB_FILTER_KEY = '__UK_IB__';

    function isUkIbCurriculum(name) {
      return UK_IB_CURRICULA.includes(name);
    }

    function getCurriculumFilterOptions() {
      const options = filters.curricula.filter((c) => !isUkIbCurriculum(c));
      if (filters.curricula.some(isUkIbCurriculum)) options.push(UK_IB_FILTER_KEY);
      const locale = isEn() ? 'en' : 'zh';
      return options.sort((a, b) =>
        curriculumFilterLabel(a).localeCompare(curriculumFilterLabel(b), locale)
      );
    }

    function curriculumFilterLabel(key) {
      if (key === UK_IB_FILTER_KEY) return t('filters.ukIb', null, 'UK + International Baccalaureate (IB)');
      return translateCurriculum(key);
    }

    function expandCurriculumFilter(selected) {
      return selected.flatMap((v) => (v === UK_IB_FILTER_KEY ? UK_IB_CURRICULA : [v]));
    }

    function splitCurriculum(name) {
      return String(name || '').split(',').map((x) => x.trim()).filter(Boolean);
    }

    function translateCurriculum(name) {
      if (!name) return '—';
      if (isEn()) return name;
      return CURRICULUM_ZH[name] || name;
    }

    function curriculumDisplayHtml(name) {
      const parts = splitCurriculum(name);
      if (!parts.length) return '—';
      return `<div class="curriculum-zh">${parts.map((p) => translateCurriculum(p)).join(' · ')}</div>`;
    }

    const GRADE_ALIASES = {
      'Pre primary': ['pre primary', 'pre-primary', 'fs1', 'preprimary'],
      'KG 1': ['kg1', 'kg 1', 'fs2'],
      'KG 2': ['kg2', 'kg 2', 'year 1'],
      'GRADE 1': ['grade 1', 'year 2', 'g1'],
      'GRADE 2': ['grade 2', 'year 3', 'g2'],
      'GRADE 3': ['grade 3', 'year 4', 'g3'],
      'GRADE 4': ['grade 4', 'year 5', 'g4'],
      'GRADE 5': ['grade 5', 'year 6', 'g5'],
      'GRADE 6': ['grade 6', 'year 7', 'g6'],
      'GRADE 7': ['grade 7', 'year 8', 'g7'],
      'GRADE 8': ['grade 8', 'year 9', 'g8'],
      'GRADE 9': ['grade 9', 'year 10', 'g9'],
      'GRADE 10': ['grade 10', 'year 11', 'g10'],
      'GRADE 11': ['grade 11', 'year 12', 'g11'],
      'GRADE 12': ['grade 12', 'year 13', 'g12'],
      'GRADE 13': ['grade 13', 'y13'],
    };

    const CN_GRADE = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三'];

    function cnGrade(n) {
      if (n >= 1 && n <= 13) return CN_GRADE[n] + '年级';
      return n + '年级';
    }

    function translateGradeToken(raw) {
      const x = String(raw || '').trim().toLowerCase().replace(/\s+/g, ' ');
      if (!x) return '';
      if (/^ecc/.test(x)) return '幼儿阶段（2-3岁）';
      if (/pre\s*primary|preprimary|pre\s*kg|pre-kg/.test(x)) return '学前（约3-4岁）';
      if (/^fs\s*1|^fs1/.test(x)) return '幼儿园小班（约3-4岁）';
      if (/^fs\s*2|^fs2/.test(x)) return '幼儿园中班（约4-5岁）';
      if (/^kg\s*1|^kg1/.test(x)) return '幼儿园大班（约4-5岁）';
      if (/^kg\s*2|^kg2/.test(x)) return '学前班（约5-6岁）';
      const ym = x.match(/^(?:year|y)\s*(\d+)$/);
      if (ym) {
        const n = Number(ym[1]);
        if (n === 13) return '十三年级（约17-18岁）';
        if (n <= 6) return '小学' + cnGrade(n) + '（约' + (n + 4) + '-' + (n + 5) + '岁）';
        return cnGrade(n) + '（约' + (n + 4) + '-' + (n + 5) + '岁）';
      }
      const gm = x.match(/^g\s*(\d+)$/);
      if (gm) {
        const n = Number(gm[1]);
        return cnGrade(n) + '（约' + (n + 5) + '-' + (n + 6) + '岁）';
      }
      const grm = x.match(/^grade\s*(\d+)$/);
      if (grm) {
        const n = Number(grm[1]);
        if (n === 13) return '十三年级（约17-18岁）';
        return cnGrade(n) + '（约' + (n + 5) + '-' + (n + 6) + '岁）';
      }
      return raw.trim();
    }

    function translateGrades(gradesStr) {
      const raw = String(gradesStr || '').trim();
      if (!raw) return { zh: '—', raw: '' };
      if (isEn()) return { zh: raw, raw: '' };
      const ranges = raw.split(',').map((x) => x.trim()).filter(Boolean);
      const zh = ranges.map((range) => {
        const parts = range.split(/\s+[–—-]\s+/);
        if (parts.length >= 2) {
          return translateGradeToken(parts[0]) + ' 至 ' + translateGradeToken(parts[parts.length - 1]);
        }
        return translateGradeToken(range);
      }).join(' · ');
      return { zh, raw };
    }

    function gradesCellHtml(gradesStr) {
      const g = translateGrades(gradesStr);
      if (g.zh === '—') return '—';
      if (!isEn() && g.raw && g.zh !== g.raw) {
        return `<div class="grades-zh">${g.zh}<small>${g.raw}</small></div>`;
      }
      return `<div class="grades-zh">${g.zh}</div>`;
    }

    function parseOneGradeRange(gradesStr) {
      const g = String(gradesStr || '').toLowerCase().replace(/\s+/g, ' ').trim();
      if (!g) return { min: 0, max: 99 };
      const parts = g.split(/\s+[-–—]\s+/);
      const mapToken = (x) => {
        x = x.trim();
        if (/ecc/.test(x) || /pre\s*primary|fs\s*1/.test(x)) return 0;
        if (/kg\s*1|fs\s*2/.test(x)) return 1;
        if (/kg\s*2|year\s*1(?!\d)/.test(x)) return 2;
        const ym = x.match(/year\s*(\d+)/);
        if (ym) return Number(ym[1]) + 1;
        const gm = x.match(/g\s*(\d+)/);
        if (gm) return Number(gm[1]) + 2;
        const grm = x.match(/grade\s*(\d+)/);
        if (grm) return Number(grm[1]) + 2;
        if (/y\s*13/.test(x)) return 15;
        return null;
      };
      if (parts.length >= 2) {
        const a = mapToken(parts[0]);
        const b = mapToken(parts[parts.length - 1]);
        if (a != null && b != null) return { min: Math.min(a, b), max: Math.max(a, b) };
      }
      return { min: 0, max: 99 };
    }

    function parseGradeRange(gradesStr) {
      const ranges = String(gradesStr || '').split(',').map((x) => parseOneGradeRange(x)).filter(Boolean);
      if (!ranges.length) return { min: 0, max: 99 };
      return {
        min: Math.min(...ranges.map((r) => r.min)),
        max: Math.max(...ranges.map((r) => r.max)),
      };
    }

    function targetGradeIndex(gradeKey) {
      const keys = Object.keys(GRADE_ALIASES);
      return keys.indexOf(gradeKey);
    }

    function schoolCoversGrade(school, gradeKey) {
      if (!gradeKey) return true;
      const idx = targetGradeIndex(gradeKey);
      if (idx < 0) return true;
      const range = parseGradeRange(school.grades);
      return idx >= range.min && idx <= range.max;
    }

    function formatFee(n) {
      if (n == null) return '—';
      return n.toLocaleString('en-AE');
    }

    function formatFeeRange(s) {
      if (s.feeMin == null && s.feeMax == null) return '—';
      if (s.feeMin === s.feeMax) return formatFee(s.feeMin);
      return `${formatFee(s.feeMin)} – ${formatFee(s.feeMax)}`;
    }

    function ratingClass(r) {
      if (!r) return 'rating-none';
      return 'rating-' + r.replace(/\s+/g, '-');
    }

    function ratingLabel(r) {
      if (!r || /not inspected/i.test(r)) return t('rating.none', null, 'Unrated');
      const map = {
        'Outstanding': t('rating.outstanding', null, 'Outstanding'),
        'Very good': t('rating.veryGood', null, 'Very Good'),
        'Good': t('rating.good', null, 'Good'),
        'Acceptable': t('rating.acceptable', null, 'Acceptable'),
        'Weak': t('rating.weak', null, 'Weak'),
        'Very weak': t('rating.veryWeak', null, 'Very Weak'),
      };
      return map[r] || r;
    }

    let compareIds = [];

    function getSelectedCurricula() {
      return [...document.querySelectorAll('#curriculumBox input:checked')].map((el) => el.value);
    }

    function updateCurriculumHint() {
      const sel = getSelectedCurricula();
      const el = document.getElementById('curriculumHint');
      el.textContent = sel.length
        ? t('filters.curriculumHintSelected', { count: sel.length }, `${sel.length} selected`)
        : t('filters.curriculumHintAll', null, 'No selection = all curricula');
    }

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function escapeAttr(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;');
    }

    function khdaHref(s) {
      if (s.khdaUrl) return s.khdaUrl;
      if (s.centerId && s.id) {
        return `https://web.khda.gov.ae/en/Education-Directory/Schools/School-Details?Id=${s.id}&CenterID=${s.centerId}`;
      }
      return meta.sourceUrl || 'https://web.khda.gov.ae/en/Education-Directory/schools';
    }

    function schoolNameHtml(s) {
      const url = khdaHref(s);
      const khdaLabel = t('table.khda', null, 'KHDA');
      return `<div class="school-name">
        <a class="school-khda-name" href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.name)}</a>
        <a class="khda-link" href="${url}" target="_blank" rel="noopener noreferrer" title="${escapeAttr(t('table.khdaTitle', { name: s.name }, `Open ${s.name} on KHDA`))}">${khdaLabel}</a>
        ${s.nameAr ? `<small>${escapeHtml(s.nameAr)}</small>` : ''}
      </div>`;
    }

    function areaMapUrl(locationName) {
      const q = encodeURIComponent(
        locationName ? `${locationName}, Dubai, UAE` : 'Dubai, UAE'
      );
      return `https://www.google.com/maps/search/?api=1&query=${q}`;
    }

    function openAreaInMaps(locationName) {
      window.open(areaMapUrl(locationName), '_blank', 'noopener,noreferrer');
    }

    function locationLinkHtml(name) {
      if (!name) return '—';
      const url = areaMapUrl(name);
      const title = t('map.viewInGoogle', { name }, `View ${name} on Google Maps`);
      return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="loc-link" title="${escapeAttr(title)}">${escapeAttr(name)}</a>`;
    }

    function renderTopAreas(sourceList) {
      const areaCounts = {};
      sourceList.forEach((s) => {
        if (s.location) areaCounts[s.location] = (areaCounts[s.location] || 0) + 1;
      });
      const topAreas = Object.entries(areaCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);
      const activeLoc = document.getElementById('location').value;
      const el = document.getElementById('topAreas');
      if (!topAreas.length) {
        el.innerHTML = `<div class="stat"><b>0</b><span>${t('stats.noSchools', null, 'No schools under current filters')}</span></div>`;
        return;
      }
      el.innerHTML = topAreas.map(([name, count], i) => {
        const active = activeLoc === name ? ' active' : '';
        const mapUrl = areaMapUrl(name);
        const rankText = t('area.rank', { rank: i + 1 }, `Rank #${i + 1}`);
        const mapTitle = t('map.googleTitle', { name }, `Google Maps: ${name}`);
        return `<div class="stat stat-area${active}" data-location="${escapeAttr(name)}" title="${escapeAttr(t('filters.location', null, 'Area'))}">
          <span class="stat-rank">${rankText}</span>
          <b>${count}</b>
          <div class="stat-area-name">
            <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="loc-link" title="${escapeAttr(mapTitle)}" onclick="event.stopPropagation()">${escapeAttr(name)}</a>
            <button type="button" class="map-btn" data-map-location="${escapeAttr(name)}" title="${escapeAttr(mapTitle)}">${t('map.button', null, 'Map')}</button>
          </div>
        </div>`;
      }).join('');
      el.querySelectorAll('.stat-area').forEach((box) => {
        box.onclick = () => {
          const loc = document.getElementById('location');
          loc.value = loc.value === box.dataset.location ? '' : box.dataset.location;
          renderTable();
        };
      });
      el.querySelectorAll('.map-btn').forEach((btn) => {
        btn.onclick = (e) => {
          e.stopPropagation();
          openAreaInMaps(btn.dataset.mapLocation);
        };
      });
    }

    function updateHeaderMetaText() {
      document.getElementById('metaTotalText').innerHTML = t(
        'header.totalSchools',
        { count: `<span id="metaTotal">${meta.totalSchools}</span>` },
        `Total <span id="metaTotal">${meta.totalSchools}</span> schools`
      );
      document.getElementById('metaDateText').innerHTML = t(
        'header.updatedAt',
        { date: `<span id="metaDate">${meta.extractedAt}</span>` },
        `Updated: <span id="metaDate">${meta.extractedAt}</span>`
      );
    }

    function renderCurriculumOptions() {
      const selected = new Set(getSelectedCurricula());
      const box = document.getElementById('curriculumBox');
      box.innerHTML = '';
      getCurriculumFilterOptions().forEach((c) => {
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = c;
        input.checked = selected.has(c);
        label.appendChild(input);
        const text = document.createElement('span');
        text.innerHTML = `<div class="curriculum-zh">${curriculumFilterLabel(c)}</div>`;
        label.appendChild(text);
        box.appendChild(label);
      });
    }

    function initMeta() {
      document.getElementById('metaYear').textContent = meta.academicYear;
      updateHeaderMetaText();
      document.getElementById('sourceNote').textContent = t(
        'meta.sourceNote',
        { note: meta.note, url: meta.sourceUrl },
        `${meta.note} Official directory: ${meta.sourceUrl}`
      );

      const box = document.getElementById('curriculumBox');
      renderCurriculumOptions();
      box.addEventListener('change', () => {
        updateCurriculumHint();
        renderTable();
      });
      document.getElementById('curriculumSelectAll').onclick = () => {
        box.querySelectorAll('input').forEach((cb) => { cb.checked = true; });
        updateCurriculumHint();
        renderTable();
      };
      document.getElementById('curriculumClearAll').onclick = () => {
        box.querySelectorAll('input').forEach((cb) => { cb.checked = false; });
        updateCurriculumHint();
        renderTable();
      };

      const loc = document.getElementById('location');
      filters.locations.forEach((l) => {
        const o = document.createElement('option');
        o.value = l;
        o.textContent = l;
        loc.appendChild(o);
      });
      loc.addEventListener('change', renderTable);

      updateCurriculumHint();

      const fees = schools.map((s) => s.feeMax).filter(Boolean);
      const maxFee = Math.ceil(Math.max(...fees, 120000) / 5000) * 5000;
      const slider = document.getElementById('feeMax');
      const num = document.getElementById('feeMaxNum');
      slider.max = maxFee;
      slider.value = maxFee;
      num.max = maxFee;
      num.value = maxFee;
    }

    function getFilters() {
      return {
        q: document.getElementById('q').value.trim().toLowerCase(),
        childGrade: document.getElementById('childGrade').value,
        curricula: getSelectedCurricula(),
        location: document.getElementById('location').value,
        rating: document.getElementById('rating').value,
        feeMax: Number(document.getElementById('feeMaxNum').value) || Infinity,
        minStudents: document.getElementById('minStudents').value
          ? Number(document.getElementById('minStudents').value)
          : 0,
        sort: document.getElementById('sort').value,
      };
    }

    function filterSchools(opts) {
      const skipLocation = opts && opts.skipLocation;
      const f = getFilters();
      let list = schools.filter((s) => {
        if (f.q) {
          const hay = (s.name + ' ' + s.nameAr + ' ' + s.location + ' ' + splitCurriculum(s.curriculum).map(translateCurriculum).join(' ')).toLowerCase();
          if (!hay.includes(f.q)) return false;
        }
        if (f.curricula.length) {
          const wanted = expandCurriculumFilter(f.curricula);
          const have = splitCurriculum(s.curriculum);
          if (!have.some((c) => wanted.includes(c))) return false;
        }
        if (!skipLocation && f.location && s.location !== f.location) return false;
        if (f.rating === '__none__') {
          if (s.rating && !/not inspected/i.test(s.rating)) return false;
        } else if (f.rating && s.rating !== f.rating) return false;
        if (!schoolCoversGrade(s, f.childGrade)) return false;
        if (s.feeMax != null && s.feeMax > f.feeMax) return false;
        if (f.minStudents && (s.students == null || s.students < f.minStudents)) return false;
        return true;
      });

      list.sort((a, b) => {
        switch (f.sort) {
          case 'rating-desc':
            return (RATING_ORDER[b.rating] ?? -1) - (RATING_ORDER[a.rating] ?? -1)
              || a.name.localeCompare(b.name);
          case 'fee-asc':
            return (a.feeMin ?? 1e9) - (b.feeMin ?? 1e9);
          case 'fee-desc':
            return (b.feeMax ?? -1) - (a.feeMax ?? -1);
          case 'students-desc':
            return (b.students ?? -1) - (a.students ?? -1) || a.name.localeCompare(b.name);
          case 'students-asc':
            return (a.students ?? 1e9) - (b.students ?? 1e9) || a.name.localeCompare(b.name);
          default:
            return a.name.localeCompare(b.name);
        }
      });
      return list;
    }

    function renderStats(list) {
      const byRating = {};
      list.forEach((s) => {
        const k = (!s.rating || /not inspected/i.test(s.rating)) ? '__none__' : s.rating;
        byRating[k] = (byRating[k] || 0) + 1;
      });
      const el = document.getElementById('stats');
      el.innerHTML = `
        <div class="stat"><b>${list.length}</b><span>${t('stats.matching', null, 'Matching schools')}</span></div>
        <div class="stat"><b>${byRating['Outstanding'] || 0}</b><span>${ratingLabel('Outstanding')}</span></div>
        <div class="stat"><b>${byRating['Very good'] || 0}</b><span>${ratingLabel('Very good')}</span></div>
        <div class="stat"><b>${byRating['Good'] || 0}</b><span>${ratingLabel('Good')}</span></div>
        <div class="stat"><b>${byRating['Acceptable'] || 0}</b><span>${ratingLabel('Acceptable')}</span></div>
        <div class="stat"><b>${byRating['__none__'] || 0}</b><span>${ratingLabel('')}</span></div>
      `;
    }

    function websiteHref(url) {
      if (!url) return '';
      const u = String(url).trim();
      if (/^https?:\/\//i.test(u)) return u;
      return 'https://' + u.replace(/^\/\//, '');
    }

    function toggleCompare(id) {
      const idx = compareIds.indexOf(id);
      if (idx >= 0) {
        compareIds.splice(idx, 1);
      } else {
        if (compareIds.length >= 4) {
          alert(t('compare.maxAlert', null, 'You can compare up to 4 schools.'));
          return;
        }
        compareIds.push(id);
      }
      renderCompareBar();
      renderTable();
    }

    function renderCompareBar() {
      const bar = document.getElementById('compareBar');
      const items = document.getElementById('compareItems');
      if (!compareIds.length) {
        bar.classList.remove('visible');
        document.getElementById('compareTable').innerHTML = '';
        return;
      }
      bar.classList.add('visible');
      items.innerHTML = compareIds.map((id) => {
        const s = schools.find((x) => x.id === id);
        return `<span class="chip">${s.name}<button type="button" data-rm="${id}" title="${escapeAttr(t('compare.remove', null, 'Remove'))}">×</button></span>`;
      }).join('');
      items.querySelectorAll('button[data-rm]').forEach((btn) => {
        btn.onclick = () => toggleCompare(Number(btn.dataset.rm));
      });
    }

    function renderCompareTable() {
      const selected = compareIds.map((id) => schools.find((s) => s.id === id)).filter(Boolean);
      if (!selected.length) return;
      const rows = [
        [t('compare.row.school', null, 'School'), ...selected.map((s) => `<a href="${khdaHref(s)}" target="_blank" rel="noopener">${escapeHtml(s.name)}</a>`)],
        [t('compare.row.area', null, 'Area'), ...selected.map((s) => s.location)],
        [t('compare.row.curriculum', null, 'Curriculum'), ...selected.map((s) => splitCurriculum(s.curriculum).map(translateCurriculum).join(' · '))],
        [t('compare.row.grade', null, 'Grades'), ...selected.map((s) => translateGrades(s.grades).zh)],
        [t('compare.row.rating', null, 'DSIB rating'), ...selected.map((s) => `${ratingLabel(s.rating)}${s.ratingYear ? ` (${s.ratingYear})` : ''}`)],
        [t('compare.row.fee', null, 'Tuition AED'), ...selected.map((s) => formatFeeRange(s))],
        [t('compare.row.students', null, 'Students'), ...selected.map((s) => s.students ?? '—')],
        [t('compare.row.established', null, 'Established'), ...selected.map((s) => s.established ?? '—')],
        [t('compare.row.phone', null, 'Phone'), ...selected.map((s) => s.phone || '—')],
        [t('compare.row.website', null, 'Website'), ...selected.map((s) => s.website ? `<a href="${websiteHref(s.website)}" target="_blank" rel="noopener">${s.website}</a>` : '—')],
        [t('compare.row.khda', null, 'KHDA'), ...selected.map((s) => `<a href="${khdaHref(s)}" target="_blank" rel="noopener">${t('table.khda', null, 'KHDA')}</a>`)],
      ];
      document.getElementById('compareTable').innerHTML = `
        <table><tbody>
          ${rows.map((r) => `<tr>${r.map((c, i) => i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join('')}</tr>`).join('')}
        </tbody></table>`;
    }

    function renderTable() {
      renderTopAreas(filterSchools({ skipLocation: true }));
      const list = filterSchools();
      renderStats(list);
      document.getElementById('resultCount').textContent = t('result.count', { count: list.length }, `Showing ${list.length}`);
      const tbody = document.getElementById('tbody');
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty">${t('empty.noSchools', null, 'No schools match your filters.')}</td></tr>`;
        return;
      }
      tbody.innerHTML = list.map((s) => {
        const inCompare = compareIds.includes(s.id);
        const star = inCompare ? '★' : '☆';
        return `<tr>
          <td><button type="button" class="star ${inCompare ? '' : 'off'}" data-cmp="${s.id}" title="${escapeAttr(t('compare.add', null, 'Add to compare'))}">${star}</button></td>
          <td>${schoolNameHtml(s)}</td>
          <td>${locationLinkHtml(s.location)}</td>
          <td>${curriculumDisplayHtml(s.curriculum)}</td>
          <td>${gradesCellHtml(s.grades)}</td>
          <td><span class="rating ${ratingClass(s.rating)}">${ratingLabel(s.rating)}</span>${s.ratingYear ? `<span class="rating-year">${s.ratingYear}</span>` : ''}</td>
          <td class="fee">${formatFeeRange(s)}</td>
          <td>${s.students != null ? s.students.toLocaleString() : '—'}</td>
        </tr>`;
      }).join('');
      tbody.querySelectorAll('button[data-cmp]').forEach((btn) => {
        btn.onclick = () => toggleCompare(Number(btn.dataset.cmp));
      });
    }

    function getFaqLocalized(item, index) {
      if (isEn()) {
        const mapped = FAQ_EN_BY_INDEX[index] || {};
        return {
          q: item.qEn || mapped.qEn || item.qZh,
          a: item.aEn || mapped.aEn || item.aZh,
        };
      }
      return { q: item.qZh, a: item.aZh };
    }

    function bindEvents() {
      ['q', 'childGrade', 'location', 'rating', 'sort', 'minStudents'].forEach((id) => {
        document.getElementById(id).addEventListener('input', renderTable);
        document.getElementById(id).addEventListener('change', renderTable);
      });
      const slider = document.getElementById('feeMax');
      const num = document.getElementById('feeMaxNum');
      slider.addEventListener('input', () => { num.value = slider.value; renderTable(); });
      num.addEventListener('input', () => { slider.value = num.value; renderTable(); });
      document.getElementById('btnReset').onclick = () => {
        document.getElementById('filters').querySelectorAll('input[type="text"], input[type="number"], select').forEach((el) => {
          if (el.id === 'feeMax' || el.id === 'feeMaxNum') return;
          if (el.type === 'number') el.value = '';
          else if (el.tagName === 'SELECT') el.selectedIndex = 0;
          else el.value = '';
        });
        document.querySelectorAll('#curriculumBox input').forEach((cb) => { cb.checked = false; });
        updateCurriculumHint();
        const max = slider.max;
        slider.value = max;
        num.value = max;
        renderTable();
      };
      document.getElementById('btnShowCompare').onclick = renderCompareTable;
      document.getElementById('btnClearCompare').onclick = () => {
        compareIds = [];
        renderCompareBar();
        renderTable();
      };
    }

    function renderFaq(filterText) {
      const q = (filterText || '').trim().toLowerCase();
      const list = document.getElementById('faqList');
      const items = FAQ.items.filter((item, index) => {
        if (!q) return true;
        const localized = getFaqLocalized(item, index);
        const hay = `${item.qZh || ''} ${item.aZh || ''} ${localized.q || ''} ${localized.a || ''}`.toLowerCase();
        return hay.includes(q);
      });
      if (!items.length) {
        list.innerHTML = `<div class="faq-empty">${t('faq.empty', null, 'No matching questions')}</div>`;
        return;
      }
      list.innerHTML = items.map((item) => {
        const originalIndex = FAQ.items.indexOf(item);
        const localized = getFaqLocalized(item, originalIndex);
        const links = (item.links || []).map((l) =>
          `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`
        ).join('');
        return `<div class="faq-item" data-id="${item.id}">
          <button type="button" class="faq-q" aria-expanded="false">${localized.q}</button>
          <div class="faq-a">
            <p>${localized.a}</p>
            ${links ? `<div class="faq-links">${links}</div>` : ''}
          </div>
        </div>`;
      }).join('');
      list.querySelectorAll('.faq-q').forEach((btn) => {
        btn.addEventListener('click', () => {
          const item = btn.closest('.faq-item');
          const open = item.classList.toggle('open');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      });
    }

    function initFaq() {
      document.getElementById('faqSourceLink').href = FAQ.sourceUrl;
      document.getElementById('faqUpdated').textContent = FAQ.lastUpdated;
      renderFaq('');
      document.getElementById('btnScrollFaq').addEventListener('click', () => {
        document.getElementById('faqSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      document.getElementById('faqSearch').addEventListener('input', (e) => renderFaq(e.target.value));
      document.getElementById('faqExpandAll').onclick = () => {
        document.querySelectorAll('.faq-item').forEach((el) => {
          el.classList.add('open');
          el.querySelector('.faq-q').setAttribute('aria-expanded', 'true');
        });
      };
      document.getElementById('faqCollapseAll').onclick = () => {
        document.querySelectorAll('.faq-item').forEach((el) => {
          el.classList.remove('open');
          el.querySelector('.faq-q').setAttribute('aria-expanded', 'false');
        });
      };
    }

    window.addEventListener('site-lang-change', () => {
      updateHeaderMetaText();
      document.getElementById('sourceNote').textContent = t(
        'meta.sourceNote',
        { note: meta.note, url: meta.sourceUrl },
        `${meta.note} Official directory: ${meta.sourceUrl}`
      );
      renderCurriculumOptions();
      updateCurriculumHint();
      renderCompareBar();
      renderTable();
      renderFaq(document.getElementById('faqSearch').value);
    });

    try {
      initMeta();
      initFaq();
      bindEvents();
      renderTable();
    } catch (err) {
      console.error(err);
      document.getElementById('tbody').innerHTML =
        `<tr><td colspan="8" class="empty">${t('empty.loadError', null, 'Page failed to load. Please refresh or rebuild the HTML file.')}</td></tr>`;
    }
  </script>
</body>
</html>
